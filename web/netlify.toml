[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"

# The configured production branch hosts the persistent development site.
# The build guard enforces development-only credentials in that context.
[context.branch-deploy]
  ignore = "exit 0"

[context.deploy-preview]
  command = "pnpm build"
