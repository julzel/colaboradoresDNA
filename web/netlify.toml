[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"

# This project is intentionally preview-only until production release work is
# explicitly approved. Exit code 0 tells Netlify to cancel these Git builds.
[context.production]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"

[context.deploy-preview]
  command = "pnpm build"
