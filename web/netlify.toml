[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"

# The configured production branch hosts the persistent development site.
# The build guard enforces development-only credentials in that context.
[context.branch-deploy]
  ignore = "exit 0"

[context.deploy-preview]
  command = "pnpm build"

# Keep the Next.js runtime explicit so Netlify packages App Router routes,
# middleware, public assets, and server functions instead of publishing the
# raw .next directory as a static site.
[[plugins]]
  package = "@netlify/plugin-nextjs"
