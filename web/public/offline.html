<!doctype html>
<html lang="es-CR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07bbc7" />
    <title>Sin conexión · Colaboradores DNA</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
        box-sizing: border-box;
        place-items: center;
        background: #f3f7f7;
        color: #0d1718;
      }

      main {
        width: min(100%, 28rem);
        padding: 2rem;
        border: 1px solid #d3dfdf;
        border-radius: 0.875rem;
        box-sizing: border-box;
        background: #fff;
        box-shadow: 0 0.75rem 2rem rgb(13 23 24 / 12%);
        text-align: center;
      }

      img {
        display: block;
        width: 6.75rem;
        height: auto;
        margin: 0 auto 1.5rem;
      }

      h1 {
        margin: 0;
        font-size: 1.75rem;
        line-height: 1.2;
      }

      p {
        margin: 0.75rem 0 1.5rem;
        color: #4c5c5d;
        line-height: 1.55;
      }

      button {
        min-height: 2.75rem;
        padding: 0 1rem;
        border: 0;
        border-radius: 0.625rem;
        background: #07bbc7;
        color: #042f32;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #061113;
          color: #f3fbfb;
        }

        main {
          border-color: #2e4447;
          background: #0d1c1f;
        }

        p {
          color: #b2c2c3;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img alt="" src="/images/dna_blue.svg" />
      <h1>Sin conexión</h1>
      <p>
        No pudimos conectar con Colaboradores DNA. Revisá tu conexión e intentá de
        nuevo.
      </p>
      <button type="button" onclick="window.location.reload()">Reintentar</button>
    </main>
  </body>
</html>
